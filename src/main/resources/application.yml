server:
  port: 9000

spring:
  ai:
    mcp:
      server:
        name: mcp-server
        protocol: STREAMABLE
        type: SYNC
        enabled: true
        resource-change-notification: true
        version: "1.0.0"
        annotation-scanner:
          enabled: true
        streamable-http:
          mcp-endpoint: /mcp
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=100,expireAfterWrite=30m
  application:
    name: mcp-server
  profiles:
    active: local

rest-client:
  github:
    url: https://api.github.com
    token:
  elasticsearch:
    url: http://localhost:9200

resources:
  refresh:
    scheduler:
      enabled: true
      initial-delay: PT10S
      fixed-delay: PT3M

stub:
  logs:
    enabled: true
    total: 300
